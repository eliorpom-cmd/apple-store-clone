<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
<defs>
<filter id="speaker-blur" x="-50%" y="-300%" width="200%" height="700%"><feGaussianBlur stdDeviation="9"/></filter>
<linearGradient id="speaker-side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset=".35" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".26"/></linearGradient>
<radialGradient id="speaker-top" cx=".4" cy=".3" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#000" stop-opacity=".1"/></radialGradient>
<pattern id="speaker-mesh" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="2" fill="#000" fill-opacity=".22"/><rect width="2" height="6" fill="#000" fill-opacity=".22"/></pattern>
</defs>
<ellipse cx="200" cy="322" rx="160" ry="14" fill="#000" fill-opacity=".22" filter="url(#speaker-blur)"/>
<rect x="50" y="140" width="300" height="122" style="fill:var(--product-color, #c9c9ce)"/>
<rect x="50" y="140" width="300" height="122" fill="url(#speaker-side)"/>
<ellipse cx="200" cy="262" rx="150" ry="44" style="fill:var(--product-color, #c9c9ce)"/>
<ellipse cx="200" cy="140" rx="150" ry="44" style="fill:var(--product-color, #c9c9ce)"/>
<ellipse cx="200" cy="140" rx="150" ry="44" fill="url(#speaker-mesh)"/>
<ellipse cx="200" cy="140" rx="150" ry="44" fill="url(#speaker-top)"/>
<ellipse cx="200" cy="140" rx="150" ry="44" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
</svg>
