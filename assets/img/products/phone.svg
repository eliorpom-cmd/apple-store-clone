<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Phone image placeholder">
  <defs>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="16" height="16" fill="#76767f" fill-opacity=".07"/><rect width="8" height="16" fill="#76767f" fill-opacity=".06"/></pattern>
    <radialGradient id="ga"><stop offset="0" stop-color="#5a68d4" stop-opacity=".9"/><stop offset="1" stop-color="#5a68d4" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb"><stop offset="0" stop-color="#9ec3ff" stop-opacity=".75"/><stop offset="1" stop-color="#9ec3ff" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="400" height="500" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="400" height="500" fill="url(#hatch)"/>
    <circle cx="168" cy="225" r="168" fill="url(#ga)"/>
    <circle cx="240" cy="290" r="152" fill="url(#gb)"/>
  </g>
  <style>@media (max-width: 160px) { .label { display: none; } }</style>
  <g class="label"><rect x="100.5" y="222.5" width="199" height="55" rx="27.5" fill="#fff" fill-opacity=".92"/>
  <text x="200" y="250" dy=".35em" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#1d1d1f"><tspan font-weight="600">Phone</tspan><tspan fill="#6e6e73"> · image</tspan></text></g>
</svg>
